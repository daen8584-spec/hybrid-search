[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-search"
version = "0.1.0"
description = "Hybrid keyword and vector retrieval service on PostgreSQL, with measured retrieval quality and latency"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[pool]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
hybrid-search = "hybrid_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL with the pgvector extension"]
filterwarnings = [
  # Emitted by Starlette whenever fastapi.testclient is imported; not actionable here.
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hybrid_search"]
