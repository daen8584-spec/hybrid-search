name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hybrid_search
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hybrid_search_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not integration"
      - run: pytest -m integration

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The embedding service is not started: the checks below do not need a model.
      - name: Build and start the API and database
        run: docker compose up -d --build --wait db api
      - name: Check the API
        run: |
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -fsS 'http://127.0.0.1:8000/search?q=aspirin&mode=keyword' | python3 -c 'import json,sys; print(json.load(sys.stdin)["results"])')" = "[]"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/search?q=aspirin&rerank=true')" = "400"
      - name: Container logs
        if: always()
        run: docker compose logs
